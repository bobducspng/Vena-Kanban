name: Deploy Fluxos na VM

# Dispara quando você dá push na main (ex.: commit feito pelo Claude Desktop).
on:
  push:
    branches: [main]
  workflow_dispatch: {} # permite rodar manualmente pelo botão "Run workflow"

concurrency:
  group: deploy-vm
  cancel-in-progress: false # não cancela um deploy no meio

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Guard: se os secrets da VM não estiverem configurados, pula o deploy em
      # vez de falhar o workflow (evita e-mails de erro até você configurar).
      - name: Verifica secrets da VM
        id: check
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          if [ -n "$VM_HOST" ] && [ -n "$VM_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets VM_HOST/VM_SSH_KEY ausentes — deploy pulado. Configure em Settings → Secrets para ativar."
          fi

      - name: Deploy via SSH na VM
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          # Puxa, builda, migra e reinicia. REPO_DIR = onde o repo está clonado.
          script: |
            set -e
            cd ${{ secrets.VM_REPO_DIR || '/opt/fluxos' }}
            ./deploy/deploy.sh
